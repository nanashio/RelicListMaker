name: Build and Release Windows Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Executable
    runs-on: windows-latest

    env:
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path 'requirements-build.txt') {
            pip install -r requirements-build.txt
          }
          if (Test-Path 'requirements.txt') {
            pip install -r requirements.txt
          }
          pip install "tkinterdnd2>=0.4.2"

      - name: Install Tesseract runtime
        shell: pwsh
        run: |
          $version = '5.4.0.20240606'
          $downloadUrl = "https://github.com/UB-Mannheim/tesseract/releases/download/v$version/tesseract-ocr-w64-setup-$version.exe"
          $installer = Join-Path $env:RUNNER_TEMP 'tesseract-installer.exe'
          $installDir = 'C:\Program Files\Tesseract-OCR'
          Write-Host "Downloading Tesseract $version from $downloadUrl"
          Invoke-WebRequest -Uri $downloadUrl -OutFile $installer
          Write-Host 'Running NSIS silent installer'
          $arguments = @(
            '/S',
            "/D=$installDir"
          )
          $process = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Tesseract installer exited with code $($process.ExitCode)"
          }

          $tessdataDir = Join-Path $installDir 'tessdata'
          $requiredLanguages = @(
            @{ Name = 'eng'; Source = 'https://github.com/tesseract-ocr/tessdata/raw/main/eng.traineddata' },
            @{ Name = 'jpn'; Source = 'https://github.com/tesseract-ocr/tessdata/raw/main/jpn.traineddata' },
            @{ Name = 'osd'; Source = 'https://github.com/tesseract-ocr/tessdata/raw/main/osd.traineddata' }
          )
          foreach ($lang in $requiredLanguages) {
            $target = Join-Path $tessdataDir ("{0}.traineddata" -f $lang.Name)
            if (-not (Test-Path $target)) {
              Write-Host "Downloading missing tessdata: $($lang.Name)"
              Invoke-WebRequest -Uri $lang.Source -OutFile $target
            }
          }

      - name: Sync Tesseract bundle
        shell: pwsh
        run: |
          $source = 'C:\Program Files\Tesseract-OCR'
          if (-not (Test-Path $source)) {
            throw "Expected Tesseract installation at $source"
          }

          $bundleRoot = 'tesseract/windows-x64'
          if (-not (Test-Path $bundleRoot)) {
            New-Item -ItemType Directory -Path $bundleRoot | Out-Null
          }

          Copy-Item -Path (Join-Path $source 'tesseract.exe') -Destination $bundleRoot -Force

          Get-ChildItem -Path $bundleRoot -Filter '*.dll' -File -ErrorAction SilentlyContinue | Remove-Item -Force
          Get-ChildItem -Path $source -Filter '*.dll' -File | Copy-Item -Destination $bundleRoot -Force

          $licensePatterns = '*.txt','COPYING*','NOTICE*','LICENSE*'
          foreach ($pattern in $licensePatterns) {
            Get-ChildItem -Path $source -Filter $pattern -File -ErrorAction SilentlyContinue |
              Copy-Item -Destination $bundleRoot -Force
          }

          $tessdataSource = Join-Path $source 'tessdata'
          $tessdataDest = Join-Path $bundleRoot 'tessdata'
          if (-not (Test-Path $tessdataDest)) {
            New-Item -ItemType Directory -Path $tessdataDest | Out-Null
          }
          foreach ($lang in @('eng','jpn','osd')) {
            $srcFile = Join-Path $tessdataSource "$lang.traineddata"
            if (Test-Path $srcFile) {
              Copy-Item -Path $srcFile -Destination $tessdataDest -Force
            }
          }

      - name: Build executable with PyInstaller
        shell: pwsh
        run: |
          pyinstaller pyinstaller.spec

      - name: Archive distribution
        shell: pwsh
        run: |
          $distPath = 'dist/RelicListMaker'
          if (-not (Test-Path $distPath)) {
            throw "PyInstaller output not found at $distPath"
          }
          $archive = 'RelicListMaker-windows.zip'
          if (Test-Path $archive) {
            Remove-Item $archive
          }
          Compress-Archive -Path "$distPath/*" -DestinationPath $archive

      - name: Generate checksum
        shell: pwsh
        run: |
          $archive = 'RelicListMaker-windows.zip'
          $hash = Get-FileHash $archive -Algorithm SHA256
          "${hash.Hash}  $archive" | Out-File -FilePath 'RelicListMaker-windows.sha256' -Encoding ascii

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: RelicListMaker-windows
          path: |
            RelicListMaker-windows.zip
            RelicListMaker-windows.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            RelicListMaker-windows.zip
            RelicListMaker-windows.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 実行内容をまとめる
        shell: pwsh
        run: |
          $summary = @"
          ## 実行内容
          - PyInstaller で Windows 向け実行ファイルをビルド
          - dist/RelicListMaker 配下を ZIP に圧縮
          - ZIP の SHA256 チェックサムを生成
          - 成果物 (ZIP/チェックサム) をワークフローのアーティファクトとして保存
          "@
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $summary += "`n- タグ実行のため GitHub Release を作成し、成果物をアップロード"
          } else {
            $summary += "`n- 手動実行のため GitHub Release は作成されません"
          }
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
