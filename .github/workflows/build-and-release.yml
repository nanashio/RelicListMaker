name: Build and Release Windows Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Executable
    runs-on: windows-latest

    env:
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path 'requirements-build.txt') {
            pip install -r requirements-build.txt
          }
          if (Test-Path 'requirements.txt') {
            pip install -r requirements.txt
          }

      - name: Build executable with PyInstaller
        shell: pwsh
        run: |
          pyinstaller pyinstaller.spec

      - name: Archive distribution
        shell: pwsh
        run: |
          $distPath = 'dist/nightreign-relic'
          if (-not (Test-Path $distPath)) {
            throw "PyInstaller output not found at $distPath"
          }
          $archive = 'nightreign-relic-windows.zip'
          if (Test-Path $archive) {
            Remove-Item $archive
          }
          Compress-Archive -Path "$distPath/*" -DestinationPath $archive

      - name: Generate checksum
        shell: pwsh
        run: |
          $archive = 'nightreign-relic-windows.zip'
          $hash = Get-FileHash $archive -Algorithm SHA256
          "${hash.Hash}  $archive" | Out-File -FilePath 'nightreign-relic-windows.sha256' -Encoding ascii

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightreign-relic-windows
          path: |
            nightreign-relic-windows.zip
            nightreign-relic-windows.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            nightreign-relic-windows.zip
            nightreign-relic-windows.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 実行内容をまとめる
        shell: pwsh
        run: |
          $summary = @"
          ## 実行内容
          - PyInstaller で Windows 向け実行ファイルをビルド
          - dist/nightreign-relic 配下を ZIP に圧縮
          - ZIP の SHA256 チェックサムを生成
          - 成果物 (ZIP/チェックサム) をワークフローのアーティファクトとして保存
          "@
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $summary += "`n- タグ実行のため GitHub Release を作成し、成果物をアップロード"
          } else {
            $summary += "`n- 手動実行のため GitHub Release は作成されません"
          }
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
